<header class="sticky top-0 z-40 border-b border-line bg-white">
  <div class="mx-auto w-full max-w-5xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-14 items-center justify-between gap-3 sm:h-[60px]">

      {# ── Logo ── #}
      <a
        href="{% url 'home' %}"
        class="group flex shrink-0 items-center gap-2.5 rounded-lg focus:outline-none"
        aria-label="TaskApp, inicio"
      >
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand text-white transition-colors duration-150 group-hover:bg-brand-deep"
          aria-hidden="true"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7" height="18" rx="1.5" opacity="0.95"/>
            <rect x="14" y="3" width="7" height="12" rx="1.5" opacity="0.75"/>
          </svg>
        </span>
        <span class="font-display text-xl font-bold leading-none tracking-tight text-ink sm:text-2xl">
          TaskApp
        </span>
      </a>

      {# ── Navegación ── #}
      <nav class="min-w-0" aria-label="Principal">
        <ul class="flex items-center gap-1 sm:gap-1.5">
          <li>
            <a
              href="{% url 'home' %}"
              class="inline-flex items-center rounded-lg px-3 py-1.5 text-sm font-medium text-muted transition-colors duration-150 hover:bg-surface hover:text-ink focus:outline-none"
            >
              Inicio
            </a>
          </li>

          {% if not request.user.is_authenticated %}
            <li>
              <a
                href="{% url 'login' %}"
                class="inline-flex items-center rounded-lg px-3 py-1.5 text-sm font-medium text-muted transition-colors duration-150 hover:bg-surface hover:text-ink focus:outline-none"
              >
                Entrar
              </a>
            </li>
            <li>
              <a
                href="{% url 'register' %}"
                class="inline-flex items-center rounded-lg bg-brand px-3.5 py-1.5 text-sm font-semibold text-white transition-colors duration-150 hover:bg-brand-deep focus:outline-none"
              >
                Crear cuenta
              </a>
            </li>
          {% else %}
            <li>
              <a
                href="{% url 'board:list' %}"
                class="inline-flex items-center rounded-lg px-3 py-1.5 text-sm font-medium text-muted transition-colors duration-150 hover:bg-surface hover:text-ink focus:outline-none"
              >
                Tableros
              </a>
            </li>
            <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button
                  type="submit"
                  class="inline-flex items-center rounded-lg px-3 py-1.5 text-sm font-medium text-muted transition-colors duration-150 hover:bg-surface hover:text-ink focus:outline-none"
                >
                  Salir
                </button>
              </form>
            </li>
            <li class="hidden sm:block">
              <span
                class="ml-1 inline-flex size-7 items-center justify-center rounded-full bg-brand-soft text-xs font-bold uppercase text-brand-deep"
                aria-hidden="true"
              >
                {{ request.user.username|slice:":1" }}
              </span>
            </li>
          {% endif %}
        </ul>
      </nav>

    </div>
  </div>
</header>
