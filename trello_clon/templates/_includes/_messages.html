{% if messages %}
  <div class="mb-6 space-y-2" role="status" aria-live="polite">
    {% for message in messages %}
      {% if message.tags == "success" %}
        <p class="rounded-lg border border-accent/25 bg-accent-soft px-4 py-3 text-sm font-medium text-accent-deep">
          {{ message }}
        </p>
      {% elif message.tags == "info" %}
        <p class="rounded-lg border border-brand/25 bg-brand-soft px-4 py-3 text-sm font-medium text-brand-deep">
          {{ message }}
        </p>
      {% else %}
        <p class="rounded-lg border border-danger/25 bg-danger-soft px-4 py-3 text-sm font-medium text-danger-deep">
          {{ message }}
        </p>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
