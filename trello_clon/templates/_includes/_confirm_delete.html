<div class="rounded-xl border border-danger/30 bg-danger-soft p-6 sm:p-8">
  <div class="flex items-start gap-4">
    <span
      class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-white text-danger"
      aria-hidden="true"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
        <path d="M12 9v4M12 17h.01" stroke-linecap="round"/>
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke-linejoin="round"/>
      </svg>
    </span>
    <div class="min-w-0">
      <h1 class="font-display text-xl font-bold tracking-tight text-ink sm:text-2xl">
        {{ title }}
      </h1>
      <p class="mt-2 text-sm leading-relaxed text-muted">
        {{ description }}
      </p>
    </div>
  </div>

  <form action="" method="POST" class="mt-6 flex items-center gap-3">
    {% csrf_token %}
    <button
      type="submit"
      class="rounded-lg bg-danger px-4 py-2.5 text-sm font-semibold text-white transition-colors duration-150 hover:bg-danger-deep focus:outline-none"
    >
      {{ button }}
    </button>
    <a
      href="{{ link }}"
      class="rounded-lg px-4 py-2.5 text-sm font-medium text-muted transition-colors duration-150 hover:text-ink focus:outline-none"
    >
      Cancelar
    </a>
  </form>
</div>
